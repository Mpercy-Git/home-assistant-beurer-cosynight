# Beurer CosyNight built-in card example
#
# No external Lovelace card is required.
# The integration serves this card automatically as custom:beurer-cosynight-card.

type: custom:beurer-cosynight-card
title: Beurer CosyNight
zones:
  - name: Left Body
    entity: select.left_side_body_zone
    tone: body
  - name: Right Body
    entity: select.right_side_body_zone
    tone: body
  - name: Left Feet
    entity: select.left_side_feet_zone
    tone: feet_left
  - name: Right Feet
    entity: select.right_side_feet_zone
    tone: feet_right
timer_select_entity: select.left_side_timer
timer_sensor_entity: sensor.left_side_timer
stop_button_entity: button.left_side_stop

# Notes:
# - Use +/- buttons or dropdown on each tile to change level.
# - Tile color intensity reflects current level state.
# - If you only have one side/device, remove the right-side zones.
