# Beurer CosyNight built-in card example
#
# No external Lovelace card is required.
# The integration serves this card automatically as custom:beurer-cosynight-card.

type: custom:beurer-cosynight-card
title: Beurer CosyNight
layout: bed # "bed" (default) or "plain" for unstyled tiles
zones:
  - name: Left Body
    entity: select.left_side_body_zone
    colour_style: body
  - name: Right Body
    entity: select.right_side_body_zone
    colour_style: body
  - name: Left Feet
    entity: select.left_side_feet_zone
    colour_style: feet
  - name: Right Feet
    entity: select.right_side_feet_zone
    colour_style: feet
timer_select_entity: select.left_side_timer
timer_sensor_entity: sensor.left_side_timer
stop_button_entity: button.left_side_stop
timers:
  - name: Left Side
    timer_select_entity: select.left_side_timer
    timer_sensor_entity: sensor.left_side_timer
    stop_button_entity: button.left_side_stop
  - name: Right Side
    timer_select_entity: select.right_side_timer
    timer_sensor_entity: sensor.right_side_timer
    stop_button_entity: button.right_side_stop

# Notes:
# - Use +/- buttons or dropdown on each tile to change level.
# - Tile colour intensity and the heat meter reflect the current level.
# - Zones are laid out on the bed by name/side (left vs right) and by
#   colour_style (body zones above feet zones).
# - Timers appear below the bed, grouped under the side they belong to.
# - If you only have one side/device, remove the right-side zones.
