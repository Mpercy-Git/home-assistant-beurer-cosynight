name: Release

# Releases are driven by the version in manifest.json: bump it, merge to main,
# and this tags v<version> and publishes a GitHub release that HACS can offer.
on:
  push:
    branches: [main]
    paths:
      - custom_components/beurer_cosynight/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the integration version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/beurer_cosynight/manifest.json'))['version'])")
          if [ -z "$version" ]; then
            echo "::error::No version found in manifest.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Check whether this version was already released
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists - nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        if: steps.check.outputs.exists == 'false'
        run: pip install -r requirements-dev.txt

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: pytest

      - name: Take release notes from the changelog
        if: steps.check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          changelog = pathlib.Path("CHANGELOG.md")
          notes = ""

          if changelog.exists():
              # Capture the "## [<version>] ..." section up to the next heading.
              pattern = rf"^##\s*\[{re.escape(version)}\].*?$(.*?)(?=^##\s|\Z)"
              match = re.search(
                  pattern, changelog.read_text(encoding="utf-8"), re.M | re.S
              )
              if match:
                  notes = match.group(1).strip()

          pathlib.Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(
              f"Changelog section for {version}: "
              + ("found" if notes else "not found, using generated notes")
          )
          PY

      - name: Create the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes
          fi
          echo "::notice::Released $TAG"
